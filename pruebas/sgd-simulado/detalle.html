<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SGD - Detalle de Expediente</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="cabecera"></div>
  <div class="contenido">
    <p><a href="bandeja.html">« Volver a la bandeja</a></p>
    <h2>Detalle del documento</h2>
    <table id="detalle"></table>
    <button class="boton" type="button" title="Botón del SGD: el Conector nunca lo acciona">Derivar documento</button>
  </div>
  <script src="datos.js"></script>
  <script>
    var sesion = SGD_SESION.exigir();
    if (sesion) {
      document.getElementById('cabecera').innerHTML = SGD_CABECERA(sesion);
      var id = Number(new URLSearchParams(location.search).get('id')) || 1;
      var d = SGD_DOCUMENTOS.find(function (x) { return x.id === id; }) || SGD_DOCUMENTOS[0];
      var filas = [['N° Expediente:', d.expediente], ['Nro. Registro', d.registro], ['Tipo de Documento', d.tipo], ['N° Documento', d.numero],
        ['Asunto', d.asunto], ['Remitente', d.remitente], ['Dependencia', d.dependencia], ['Fecha de Documento', d.fecha], ['Estado', d.estado], ['Folios', d.folios]];
      document.getElementById('detalle').innerHTML = filas.map(function (f) { return '<tr><td class="lbl">' + f[0] + '</td><td>' + f[1] + '</td></tr>'; }).join('');
      document.querySelector('.boton').addEventListener('click', function () { alert('Acción del SGD ejecutada por el usuario.'); });
    }
  </script>
</body>
</html>
