<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SGD - Inicio de sesión</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <!-- SGD simulado para pruebas del Conector SGD. Acepta cualquier usuario y contraseña. -->
  <form class="login" id="ingreso">
    <h2>Sistema de Gestión Documental</h2>
    <div class="aviso">Entorno simulado de pruebas. Ingrese cualquier usuario y contraseña.</div>
    <label for="usuario">Usuario</label><input id="usuario" name="usuario" autocomplete="username" value="mquispe">
    <label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password">
    <button type="submit">Ingresar</button>
    <div class="error" id="error"></div>
  </form>
  <script src="datos.js"></script>
  <script>
    if (SGD_SESION.obtener()) location.replace('bandeja.html');
    document.getElementById('ingreso').addEventListener('submit', function (e) {
      e.preventDefault();
      var u = this.usuario.value.trim(), c = this.clave.value;
      if (!u || !c) { document.getElementById('error').textContent = 'Ingrese usuario y contraseña.'; return; }
      SGD_SESION.iniciar(u);
      location.href = 'bandeja.html';
    });
  </script>
</body>
</html>
