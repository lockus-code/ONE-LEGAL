<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEGAL · Gestión de Procesos</title>
  <meta name="description" content="Portal institucional de gestión de procesos legales, tareas, plazos y trámites SGD indexados.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%2312345f%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2219%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22%23fff%22 text-anchor=%22middle%22%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#vista">Ir al contenido</a>

  <!-- Ingreso -->
  <div id="pantalla-ingreso" class="ingreso" hidden>
    <form id="form-ingreso" class="ingreso__caja tarjeta" novalidate>
      <div class="marca marca--clara">
        <span class="marca__logo" aria-hidden="true">L</span>
        <div><strong>LEGAL</strong><span>Gestión de Procesos Legales</span></div>
      </div>
      <h2>Ingresar</h2>
      <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
      <p id="ingreso-mensaje" class="aviso aviso--alerta" hidden></p>
      <button class="btn btn--primario" type="submit">Ingresar</button>
      <p class="secundario" id="ingreso-servidor"></p>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <aside class="lateral" id="lateral">
      <div class="marca">
        <span class="marca__logo" aria-hidden="true">L</span>
        <div>
          <strong>LEGAL</strong>
          <span id="marca-entidad">Gestión de Procesos Legales</span>
        </div>
      </div>
      <nav id="menu" class="menu" aria-label="Navegación principal"></nav>
      <div class="lateral__pie">
        <span id="estado-bd"></span>
      </div>
    </aside>

    <div class="marco">
      <header class="superior">
        <button type="button" class="btn-icono menu-movil" id="btn-menu" aria-label="Abrir menú" aria-controls="lateral" aria-expanded="false">☰</button>
        <div class="superior__titulo">
          <h1 id="titulo-vista">Panel</h1>
          <p id="subtitulo-vista"></p>
        </div>
        <div class="perfil">
          <a href="#alertas" class="campana" id="campana" title="Alertas"><span aria-hidden="true">🔔</span><span class="campana__n" id="campana-n">0</span><span class="sr">alertas</span></a>
          <div class="cuenta-menu">
            <button type="button" class="cuenta-menu__boton" id="btn-cuenta" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-cuenta">
              <span class="avatar" id="avatar" aria-hidden="true"></span>
              <span class="perfil__rol"><strong id="usuario-nombre"></strong><span id="usuario-rol"></span></span>
              <span aria-hidden="true">▾</span>
            </button>
            <div class="cuenta-menu__lista" id="menu-cuenta" role="menu" hidden>
              <button type="button" role="menuitem" data-cuenta="clave">Cambiar contraseña</button>
              <button type="button" role="menuitem" data-cuenta="extension">Instalar la extensión Conector SGD</button>
              <hr>
              <button type="button" role="menuitem" data-cuenta="salir">Cerrar sesión</button>
            </div>
          </div>
        </div>
      </header>
      <main id="vista" class="vista" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal__fondo" data-cerrar></div>
    <div class="modal__caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div id="modal-contenido"></div>
    </div>
  </div>
  <div id="confirmacion" class="modal modal--confirmacion" hidden>
    <div class="modal__fondo" data-cancelar></div>
    <div class="modal__caja modal__caja--angosta" role="alertdialog" aria-modal="true" aria-describedby="confirmacion-texto">
      <div class="modal__cuerpo modal__cuerpo--simple">
        <p id="confirmacion-texto"></p>
        <div class="modal__pie" style="padding:0">
          <button type="button" class="btn" data-cancelar>Cancelar</button>
          <button type="button" class="btn btn--primario" id="confirmacion-aceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="notificacion" class="notificacion" role="status" hidden></div>

  <script src="js/nucleo.js"></script>
  <script src="js/vistas-panel.js"></script>
  <script src="js/vistas-procesos.js"></script>
  <script src="js/tareas.js"></script>
  <script src="js/vistas-plantillas.js"></script>
  <script src="js/vistas-admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
